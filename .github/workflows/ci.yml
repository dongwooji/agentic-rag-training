name: Public code CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Check Python syntax
        run: python -m compileall src
      - name: Run public tests
        run: python -m pytest -m "not requires_local_artifacts" -q
